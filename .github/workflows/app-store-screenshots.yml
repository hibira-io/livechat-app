# App Store listing: Actions → app-store-screenshots → Run workflow.
# Works on the iOS version being prepared in App Store Connect (created as
# `version` when there is none), with the same team API key as the release:
# - metadata: store/ios/metadata (texts per language, categories, age
#   rating, content rights, review details)
# - screenshots: replaces the 6.9" iPhone screenshots with
#   store/ios/screenshots/<locale>/*, in name order
# - inspect: prints the reference app's age rating and review details
name: app-store-screenshots
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to create when none is being prepared
        default: "1.0"
      step:
        description: What to update
        type: choice
        options: [all, metadata, screenshots, inspect]
        default: all

permissions:
  contents: read

concurrency:
  group: app-store-screenshots

env:
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
  BUNDLE_ID: io.hibira.chat
  VERSION: ${{ inputs.version }}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Inspect
        if: inputs.step == 'inspect'
        run: node .github/scripts/asc-inspect.mjs
      - name: Metadata
        if: inputs.step == 'all' || inputs.step == 'metadata'
        env:
          ASC_DEMO_USER: ${{ secrets.ASC_DEMO_USER }}
          ASC_DEMO_PASSWORD: ${{ secrets.ASC_DEMO_PASSWORD }}
        run: node .github/scripts/asc-metadata.mjs
      - name: Screenshots
        if: inputs.step == 'all' || inputs.step == 'screenshots'
        run: node .github/scripts/asc-screenshots.mjs
